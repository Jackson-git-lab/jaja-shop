name: Backend CI

# Déclencheurs : à chaque push sur n'importe quelle branche, ou manuellement.
on:
  push:
  workflow_dispatch:

# Droits minimaux : le workflow peut seulement lire le dépôt.
permissions:
  contents: read

# Si on pousse de nouveau sur la même branche, on annule l'exécution précédente encore en cours.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build et tests
    runs-on: ubuntu-latest

    # PostgreSQL temporaire pour les tests, démarré dans un conteneur.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jajashop_test
          POSTGRES_USER: jajashop
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jajashop -d jajashop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Toutes les commandes "run" s'exécutent dans le dossier backend.
    defaults:
      run:
        working-directory: backend

    # Variables lues par application-test.yml (remplacent le fichier .env en local).
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: jajashop
      DB_PASSWORD: ci_only_password

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler et lancer les tests
        run: ./mvnw -B -ntp verify

      - name: Conserver les rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-de-tests
          path: backend/target/surefire-reports/
spring:
  application:
    name: jaja-shop-api
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    
server:
  port: 8081


springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false